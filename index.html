<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f6f7fa">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="v2/app.css?v=1">
</head>
<body class="stage">
<div id="sky"><i></i><i></i><i></i></div>
<div id="orbit"><div id="globe"></div></div>
<div id="halo"></div>

<header id="mark">J A R V I S</header>
<div id="hint"><span>Berühren</span></div>

<section id="hud">
  <div id="hello" class="rv" style="--d:0">
    <div class="hl1" id="hl1">Guten Abend,</div>
    <div class="hl2">Master.</div>
    <div class="hl3" id="hl3">Bern</div>
  </div>
  <div id="chips">
    <button class="chip rv" style="--d:1" data-k="wx"><small>Bern</small><b id="cWx">–</b></button>
    <button class="chip rv" style="--d:2" data-k="fl"><small>Über Ihnen</small><b id="cFl">–</b></button>
    <button class="chip rv" style="--d:3" data-k="eq"><small>Erdbeben 24 h</small><b id="cEq">–</b></button>
    <button class="chip rv" style="--d:4" data-k="mk"><small>SMI</small><b id="cMk">–</b></button>
  </div>
  <nav id="dock" class="rv" style="--d:5">
    <button data-a="lage"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span>Weltlage</span></button>
    <button data-a="flights"><svg viewBox="0 0 24 24"><path d="M10.5 3.5c.8-.8 2.2-.8 3 0v6l7 4v2l-7-2v4l2 1.5V21l-3.5-1L8.5 21v-2l2-1.5v-4l-7 2v-2l7-4z"/></svg><span>Flüge</span></button>
    <button data-a="cams"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/></svg><span>Kameras</span></button>
    <button data-a="wx"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></svg><span>Wetter</span></button>
    <button data-a="mk"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg><span>Märkte</span></button>
    <button data-a="classic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Mehr</span></button>
  </nav>
  <div id="talk" class="rv" style="--d:6">
    <form id="ask"><input id="q" placeholder="Was wünschen Sie, Master?" autocomplete="off" enterkeyhint="send"><button aria-label="Senden">→</button></form>
    <button id="mic" aria-label="Sprechen"><canvas id="wave" width="120" height="120"></canvas><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
  <div id="cap" class="rv" style="--d:7"><em id="capS">Tippen Sie aufs Mikrofon oder schreiben Sie.</em><p id="capT"></p></div>
</section>

<aside id="sheet"><div class="sh-top"><button id="shX" aria-label="Schliessen">✕</button><i class="grip"></i></div><div id="shB"></div></aside>
<div id="toast"></div>

<script src="lib/maplibre-gl.js"></script>
<script src="v2/app.js?v=1"></script>
<script src="v2/voice.js?v=1"></script>
</body>
</html>
